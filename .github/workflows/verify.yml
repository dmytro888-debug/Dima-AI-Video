name: Verify Dima AI Studio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile local-engine/generate_local.py
